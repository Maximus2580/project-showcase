<!doctype html><html lang="ko"><meta charset="utf-8"><title>문의 분류 데모</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff3f5;color:#132d3b;font:24px system-ui;padding:48px}header{font-size:20px;color:#546e7b;margin-bottom:32px}h1{font-size:40px;margin:0 0 36px}main{display:grid;grid-template-columns:1fr 1fr;gap:32px}section{background:white;border:1px solid #d8e2e6;border-radius:16px;padding:32px}label{display:block;font-size:18px;margin-bottom:16px}textarea{font:24px system-ui;width:100%;height:180px;padding:20px;border:1px solid #bccdd4;border-radius:8px}button{background:#176a56;border:0;border-radius:8px;color:white;font:22px system-ui;padding:16px 28px;margin-top:22px}#result{font-size:36px;color:#176a56;font-weight:700;margin:26px 0}small{font-size:18px;color:#526975}footer{font-size:16px;margin-top:30px;color:#526975}</style><header>PROJECT LAB / 공개 예제</header><h1>문의의 첫 분류를 도와드립니다</h1><main><section><label for="inquiry">문의 내용</label><textarea id="inquiry">배송이 언제 도착하나요?</textarea><button id="classify">분류 초안 보기</button></section><section><small>분류 결과</small><div id="result">입력을 기다립니다</div><p id="reason">결과와 근거를 확인한 뒤 사용하세요.</p></section></main><footer>키워드 규칙 기반 학습용 예제 · LLM 사용 없음 · 실제 고객 데이터 없음</footer><script>
const classify=text=>text.includes('배송')?{label:'배송 문의',reason:'근거: 입력 문장에 “배송”이 있습니다.'}:text.includes('환불')?{label:'환불 문의',reason:'근거: 입력 문장에 “환불”이 있습니다.'}:{label:'담당자 확인 필요',reason:'정의된 키워드가 없습니다.'};
document.querySelector('#classify').onclick=()=>{const r=classify(document.querySelector('#inquiry').value);document.querySelector('#result').textContent=r.label;document.querySelector('#reason').textContent=r.reason;};
</script></html>
